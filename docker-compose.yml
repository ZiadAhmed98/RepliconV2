version: '3.8'

services:
  app:
    build: .
    # This adds 'production', 'test', or 'development' to the container name so they don't collide
    container_name: mds_dashboard_${NODE_ENV}
    restart: always
    ports:
      # This binds your unique host port (3000, 3001, 3002) to the container's internal port 3000
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  # SQLite Web UI — browse/query the database at http://<server>:8080
  # Protected by HTTP Basic Auth (set DB_UI_USER / DB_UI_PASS in .env, or hardcode below)
  # To disable: comment out this whole block
  db-ui:
    image: coleifer/sqlite-web
    container_name: mds_db_ui_${NODE_ENV}
    restart: unless-stopped
    ports:
      - "${DB_UI_PORT:-8888}:8080"
    volumes:
      - ./data:/data
    command: ["-H", "0.0.0.0", "-p", "8080", "/data/mds.db"]
